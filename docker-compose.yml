name: zhidao

services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    command: >
      sh -c "uv sync --frozen --no-dev &&
             mkdir -p /app/runtime &&
             mkdir -p /app/data/uploads/chat /app/data/uploads/knowledge &&
             uv run uvicorn main:app --host 0.0.0.0 --port 8080"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/runtime/zhidao.db
      QDRANT_URL: http://qdrant:6333
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./.env:/app/.env:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - huggingface-cache:/root/.cache/huggingface
      - backend-data:/app/data
      - backend-db:/app/runtime
      - backend-venv:/app/.venv
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./fronted:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  backend-data:
  backend-db:
  backend-venv:
  frontend-node-modules:
  huggingface-cache:
  qdrant-data:
  redis-data:
